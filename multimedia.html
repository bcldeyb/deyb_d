<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multimedia Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: lightblue;
        }

        h1 {
            text-align: center;
            color: purple;
        }

        .section {
            border: 4px solid purple;
            padding: 15px;
            margin-bottom: 20px;
            background-color: orange;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .pictures {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .pictures img {
            width: 250px;
            height: 250px;
            object-fit: cover;
        }

        .song {
            margin-bottom: 15px;
        }

        .song p {
            margin-bottom: 5px;
            font-weight: bold;
        }

        audio {
            width: 300px;
        }
        .new-box {
            border: 2px solid purple;
            padding: 15px;
            margin-top: 20px;
            background-color: lightblue;
            border-radius: 10px;
        }

    </style>
</head>

<body>

    <h1>My Album</h1>

    <!-- 5 PICTURES -->
    <div class="section">
        <h2>Favourite Photos</h2>

        <div class="pictures">

            <img src="https://uploads.onecompiler.io/44yjqwgm7/1787023198459/htmlpic1.jpg" alt="Favourite Photo 1">

            <img src="https://uploads.onecompiler.io/44yjqwgm7/1787023515694/htmlpic2.jpeg" alt="Favourite Photo 2">

            <img src="https://uploads.onecompiler.io/44yjqwgm7/1787023543669/htmlpic3.jpeg" alt="Favourite Photo 3">

            <img src="https://uploads.onecompiler.io/44yjqwgm7/1787023549662/htmlpic4.jpeg" alt="Favourite Photo 4">

            <img src="https://uploads.onecompiler.io/44yjqwgm7/1787023555989/htmlpic5.jpg" alt="Favourite Photo 5">

        </div>
    </div>


    <!-- 5 AUDIO SONGS -->
    <div class="section">
        <h2>Music List</h2>

        <div class="song">
            <p>1. Owl City - Fireflies</p>
            <audio controls>
                <source src="Owl City - Fireflies (Official Music Video).mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="song">
            <p>2. Bread - Everything I Own</p>
            <audio controls>
                <source src="Bread - Everything I Own (1972).mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="song">
            <p>3. The Beatles - Here, There and Everywhere</p>
            <audio controls>
                <source src="The Beatles - Here, There and Everywhere.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="song">
            <p>4. TJ Monterde - Palagi</p>
            <audio controls>
                <source src="PALAGI - TJ Monterde  OFFICIAL MUSIC VIDEO.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="song">
            <p>5. Silent Sanctuary - Kundiman</p>
            <audio controls>
                <source src="Silent Sanctuary - Kundiman (Lyrics).mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="new-box">
             <h2>Cute Cats Video</h2>
             <video controls width="300">
            <source src="videoplayback.mp4" type="video/mp4">
    </video>
</div>
</div>

</body>
</html>
